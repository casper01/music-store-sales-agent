[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-store-sales-agent"
version = "1.0.0"
description = "Read-only SQL + RAG tool-calling agent for the Chinook sample database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0,<2",
    "openai>=1.60,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
sales-agent = "sales_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the real LLM API (requires LLM_API_KEY and a built index)",
]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Tools expose JSON-Schema dicts as class attributes to satisfy the AgentTool protocol.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["sales_agent"]
known-local-folder = ["conftest", "fakes"]

